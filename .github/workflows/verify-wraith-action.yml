name: Verify Wraith Action E2E
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  wraith-gate-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: gate
        uses: ./
        with:
          command: gate
          working-directory: .ci-test-fixtures/valid-app
          wraith-version: source
          fail-on-unextracted: "true"
          comment: "true"
      - run: |
          echo "VALID_CHECK=${{ steps.gate.outputs.check }}"
          test "${{ steps.gate.outputs.check }}" = "PASS"

  wraith-gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: gate
        uses: ./
        with:
          command: gate
          working-directory: .ci-test-fixtures/broken-app
          wraith-version: source
          fail-on-unextracted: "true"
          comment: "false"
